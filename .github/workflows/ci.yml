name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests
      - name: Lint workflows
        run: scripts/lint-workflows.sh
      - name: Verify Aspire acquisition and runner Docker tools
        run: |
          bash scripts/install-aspire.sh "$RUNNER_TEMP/aspire-cli"
          docker version
          docker compose version
          docker buildx version
